<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tejas Goyal — Finance · Business Operations · Strategy</title>
<meta name="description" content="Entrepreneurship student and operator who's launched, priced, and run six ventures with real money on the table.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F1E8;
    --surface: #FFFFFF;
    --ink: #171717;
    --muted: #62605C;
    --accent: #A5222C;
    --accent-strong: #A5222C;
    --accent-display: #A5222C;
    --accent-soft: #F2DEDC;
    --border: #DED9CE;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(23,23,23,0.04), 0 1px 3px rgba(23,23,23,0.03);
    --shadow-md: 0 2px 4px rgba(23,23,23,0.04), 0 14px 30px -16px rgba(23,23,23,0.18);

    --font-display: 'Bricolage Grotesque', 'Inter', -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }

  html.dark {
    --bg: #121110;
    --surface: #1A1918;
    --ink: #EFEBE3;
    --muted: #A39F97;
    --accent: #A5222C;
    --accent-strong: #A5222C;
    --accent-display: #A5222C;
    --accent-soft: #2A1C1D;
    --border: #2C2A26;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-md: 0 2px 4px rgba(0,0,0,0.3), 0 16px 32px -16px rgba(0,0,0,0.65);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; border-color: var(--border); }
  html { scroll-behavior: smooth; }
  body {
    background-color: var(--bg);
    position: relative;
    color: var(--ink);
    font-family: var(--font-body);
    transition: background-color 0.3s ease, color 0.3s ease;
    min-height: 100vh;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    opacity: 0.04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }
  #app { position: relative; z-index: 1; }

  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  img { max-width: 100%; display: block; }

  h1, h2, h3, h4, .font-display {
    font-family: var(--font-display);
    letter-spacing: -0.03em;
    font-weight: 700;
    font-variation-settings: "opsz" 48;
    line-height: 1.08;
  }
  .font-mono-num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  ::selection { background: var(--accent-strong); color: #fff; }

  .max-w-6xl { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem; }
  .max-w-5xl { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem; }
  .max-w-3xl { max-width: 48rem; margin: 0 auto; padding: 0 1.5rem; }

  /* Nav */
  header {
    position: sticky; top: 0; z-index: 40; width: 100%;
    transition: background-color 0.3s, border-color 0.3s;
    border-bottom: 1px solid transparent;
  }
  header.scrolled {
    background: color-mix(in srgb, var(--bg) 90%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  nav.navbar {
    max-width: 72rem; margin: 0 auto; padding: 1rem 1.5rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.02em; }
  .nav-links { display: none; align-items: center; gap: 1.75rem; }
  .nav-links a {
    font-size: 0.875rem; color: var(--muted); position: relative; padding-bottom: 0.25rem;
    transition: color 0.2s; cursor: pointer; background: none; border: none; font-family: var(--font-body);
  }
  .nav-links a:hover { color: var(--ink); }
  .nav-links a.active { color: var(--ink); }
  .nav-links a.active::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 1.5px; background: var(--accent);
  }
  .theme-toggle {
    border-radius: 999px; padding: 0.5rem; color: var(--muted); background: none; border: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: color 0.2s, background 0.2s;
  }
  .theme-toggle:hover { color: var(--ink); background: var(--accent-soft); }
  .menu-toggle { display: inline-flex; padding: 0.5rem; background: none; border: none; color: var(--ink); cursor: pointer; }
  .mobile-menu {
    display: none; border-top: 1px solid var(--border); background: var(--bg);
    padding: 1rem 1.5rem 1.25rem; flex-direction: column; gap: 1rem;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a { font-size: 0.875rem; color: var(--muted); background: none; border: none; text-align: left; cursor: pointer; font-family: var(--font-body); }
  .mobile-menu a.active { color: var(--ink); }
  .mobile-menu .mtheme { display: flex; align-items: center; gap: 0.5rem; color: var(--muted); }

  @media (min-width: 768px) {
    .nav-links { display: flex; }
    .menu-toggle { display: none; }
    .mobile-menu { display: none !important; }
  }

  /* Buttons / pills */
  .btn {
    display: inline-flex; align-items: center; gap: 0.5rem; border-radius: 999px;
    padding: 0.6rem 1.25rem; font-size: 0.875rem; font-weight: 500; transition: all 0.2s;
    cursor: pointer; border: none; font-family: var(--font-body);
  }
  .btn-primary { background: var(--accent-strong); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary { border: 1px solid var(--border); color: var(--ink); background: transparent; }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost { color: var(--ink); background: transparent; }
  .btn-ghost:hover { color: var(--accent); }

  .pill {
    display: inline-flex; align-items: center; border-radius: 999px; background: var(--accent-soft);
    color: var(--ink); padding: 0.25rem 0.75rem; font-size: 0.75rem; font-weight: 500;
  }

  .eyebrow {
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--accent); margin-bottom: 0.75rem;
  }

  .card {
    border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm);
  }

  .ledger-rule { position: relative; }
  .ledger-rule::after {
    content: ""; position: absolute; left: 0; bottom: -2px; height: 1px; width: 100%; background: var(--border);
  }

  /* fade in — scroll triggered */
  .fade-in {
    opacity: 0; transform: translateY(22px);
    transition: opacity 0.7s cubic-bezier(.16,.8,.28,1), transform 0.7s cubic-bezier(.16,.8,.28,1);
    will-change: opacity, transform;
  }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  /* page transition */
  #app { transition: opacity 0.22s ease; }
  #app.page-leaving { opacity: 0; }

  /* animated underline sweep on nav */
  .nav-links a::before {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0; height: 1.5px;
    background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.3s ease;
  }
  .nav-links a:hover::before { transform: scaleX(1); }
  .nav-links a.active::before { display: none; }

  /* button micro-interaction */
  .btn { position: relative; overflow: hidden; }
  .btn-primary:active, .btn-secondary:active, .btn-ghost:active { transform: scale(0.97); }

  /* card tilt/glow interactivity */
  .project-card, .lead-card, .exp-card {
    position: relative;
    transition: transform 0.35s cubic-bezier(.16,.8,.28,1), box-shadow 0.35s ease, border-color 0.35s ease;
  }
  .project-card::before, .lead-card::before {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0;
    background: radial-gradient(220px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%);
    transition: opacity 0.4s ease; z-index: 1;
  }
  .project-card:hover::before, .lead-card:hover::before { opacity: 0; }
  .project-card:hover, .lead-card:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }

  .project-cover span { transition: transform 0.5s cubic-bezier(.16,.8,.28,1), opacity 0.5s ease; }
  .project-card:hover .project-cover span { transform: scale(1.12) rotate(-3deg); opacity: 0.4; }

  .project-cover-pdf { background: var(--surface); }
  .cover-pdf-embed { width: 100%; height: 100%; border: none; pointer-events: none; }
  .cover-pdf-shield { position: absolute; inset: 0; background: transparent; }

  .explore-item, .channel { position: relative; overflow: hidden; }
  .explore-item::after, .channel::after {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent);
    transform: scaleY(0); transform-origin: bottom; transition: transform 0.35s cubic-bezier(.16,.8,.28,1);
  }
  .explore-item:hover::after, .channel:hover::after { transform: scaleY(1); }

  .timeline-entry .dot { transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .timeline-entry:hover .dot { transform: scale(1.5); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }

  .ledger-item { transition: background 0.3s ease; }
  .ledger-item:hover { background: color-mix(in srgb, var(--accent-soft) 60%, transparent); }

  .brand { display: inline-block; transition: transform 0.3s ease; }
  .brand:hover { transform: translateY(-1px); }

  .theme-toggle svg { transition: transform 0.4s cubic-bezier(.34,1.56,.64,1); }
  .theme-toggle:hover svg { transform: rotate(24deg) scale(1.1); }

  @media (prefers-reduced-motion: reduce) {
    .fade-in, .fade-in.visible, .project-card, .lead-card, .exp-card, #app { transition: none !important; }
  }

  /* Page sections */
  .page { display: none; }
  .page.visible { display: block; }

  .section { padding-top: 5rem; padding-bottom: 5rem; }
  .section-tight { padding-top: 4rem; padding-bottom: 3rem; }
  .border-top { border-top: 1px solid var(--border); }
  .border-y { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  /* Hero — live poster: text in HTML, cut-out photo layered over the name */
  .hero { padding-top: 1.5rem; padding-bottom: 3.5rem; overflow: hidden; }
  @media (min-width: 640px) { .hero { padding-top: 2.5rem; padding-bottom: 4.5rem; } }
  .hero-toprow { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .hero-greeting { font-family: var(--font-body); font-weight: 700; font-size: clamp(1rem, 2.2vw, 1.6rem); letter-spacing: -0.01em; }
  .hero-institution {
    font-family: var(--font-mono); font-weight: 500; font-size: clamp(0.72rem, 1.4vw, 0.85rem);
    letter-spacing: 0.12em; white-space: nowrap; border: 1px solid var(--border); color: var(--ink);
    border-radius: 999px; padding: 0.35rem 0.95rem; background: color-mix(in srgb, var(--surface) 60%, transparent);
  }
  .hero-stage { margin-top: 0.75rem; }
  .hero-visual { min-width: 0; position: relative; height: clamp(22rem, 62vw, 36rem); }
  .hero-name {
    position: relative; z-index: 1; margin: 0; white-space: nowrap; text-align: center;
    font-family: var(--font-display); color: var(--accent-display); font-weight: 800; letter-spacing: -0.055em;
    font-variation-settings: "opsz" 96; font-size: clamp(3.4rem, 15vw, 12rem); line-height: 0.9; padding-bottom: 0.06em;
  }
  .hero-photo {
    position: absolute; z-index: 2; left: var(--photo-x, 50%); bottom: 0; transform: translateX(-50%);
    height: 92%; width: auto; max-width: none; pointer-events: none;
    filter: drop-shadow(0 20px 30px rgba(0,0,0,0.35));
    -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
  }
  html:not(.dark) .hero-photo { filter: drop-shadow(0 16px 22px rgba(0,0,0,0.12)); }
  .hero-tagline {
    font-family: var(--font-display); font-weight: 600; font-variation-settings: "opsz" 36;
    font-size: clamp(1.2rem, 2.3vw, 1.7rem); line-height: 1.22; letter-spacing: -0.02em;
    max-width: 22ch; margin: 1.5rem 0 0;
  }
  .hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1rem; margin-top: 1.75rem; position: relative; z-index: 3; }
  .hero-rule { height: 1px; background: var(--border); position: relative; z-index: 3; }
  @media (min-width: 860px) {
    .hero-stage { display: grid; grid-template-columns: minmax(0, 1fr); }
    .hero-visual, .hero-stage .hero-tagline { grid-area: 1 / 1; }
    .hero-stage .hero-tagline { align-self: end; position: relative; z-index: 3; margin: 0 0 2.5rem; max-width: 15ch; }
  }
  /* entrance: photo only, kept gentle */
  @keyframes heroPhoto { from { opacity: 0; transform: translateX(-50%) translateY(24px); } to { opacity: 1; transform: translateX(-50%); } }
  .hero-photo { animation: heroPhoto 0.9s 0.1s cubic-bezier(.16,.8,.28,1) both; }
  @media (prefers-reduced-motion: reduce) { .hero-photo { animation: none !important; } }

  /* Welcome intro: one panel that slides away */
  html.intro-on, html.intro-on body { overflow: hidden; }
  html.intro-on .hero, html.intro-on .hero * { animation-play-state: paused !important; }
  #intro { position: fixed; inset: 0; z-index: 200; cursor: pointer; color: #EFEBE3; }
  #intro.gone { pointer-events: none; }
  .intro-panel { position: absolute; inset: 0; background: #121110; transition: transform 0.85s cubic-bezier(.76,0,.24,1); }
  #intro.lift .intro-panel { transform: translateY(-100%); }
  .intro-inner {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6rem;
    transition: opacity 0.3s ease;
  }
  #intro.out .intro-inner { opacity: 0; }
  .intro-word { display: flex; align-items: center; gap: 0.9rem; font-family: var(--font-display); font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 6.5rem); letter-spacing: -0.04em; }
  .intro-word i { width: 0.22em; height: 0.22em; border-radius: 50%; background: #A5222C; flex-shrink: 0; }
  .intro-slot { position: relative; height: 1.4em; line-height: 1.4em; padding: 0 0.08em; }
  .intro-slot > span { display: inline-block; white-space: nowrap; }
  .intro-bar { width: min(14rem, 50vw); height: 2px; background: rgba(255,255,255,0.12); border-radius: 2px; overflow: hidden; }
  .intro-bar b { display: block; height: 100%; width: 0; background: #A5222C; transition: width 1.4s cubic-bezier(.65,0,.35,1); }
  .intro-meta { position: absolute; left: 1.5rem; right: 1.5rem; bottom: 1.5rem; display: flex; justify-content: space-between; align-items: flex-end;
    font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
  .intro-meta b { color: #A5222C; font-weight: 500; }

  /* Big red statement section — matches the "entrepreneurship student" mockup */
  .section-big { padding-top: 5rem; padding-bottom: 5rem; }
  @media (min-width: 640px) { .section-big { padding-top: 6rem; padding-bottom: 6rem; } }
  .section-big h2.font-display {
    color: var(--accent-display); font-size: clamp(2.25rem, 6.5vw, 4.75rem); line-height: 0.96;
    max-width: 20ch; margin-bottom: 2rem;
  }
  .section-big-body { font-size: clamp(1.05rem, 2vw, 1.4rem); color: var(--ink); max-width: 42ch; line-height: 1.55; }
  .section-big-body .hl { color: var(--accent); font-weight: 700; }
  html:not(.dark) .section-big-body { color: var(--ink); opacity: 0.85; }

  /* Ledger stats */
  .ledger-grid { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .ledger-grid { grid-template-columns: repeat(4, 1fr); } }
  .ledger-item { padding: 2rem 0; border-bottom: 1px solid var(--border); }
  .ledger-grid > .ledger-item:last-child { border-bottom: none; }
  @media (min-width: 640px) {
    .ledger-item { padding: 2rem 1.5rem; border-bottom: none; border-left: 1px solid var(--border); }
    .ledger-grid > .ledger-item:first-child { border-left: none; padding-left: 0; }
    .ledger-grid > .ledger-item:last-child { padding-right: 0; }
  }
  .ledger-item .entry-no { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
  .ledger-item .entry-value { font-family: var(--font-mono) !important; font-weight: 500; letter-spacing: -0.03em; font-size: 1.75rem; margin-bottom: 0.25rem; color: var(--ink); }
  .ledger-item .entry-sub { font-size: 0.875rem; color: var(--muted); }
  .ledger-item .entry-label { font-size: 11px; color: var(--muted); margin-top: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; }

  /* Currently */
  .currently-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
  @media (min-width: 640px) { .currently-grid { grid-template-columns: 1fr 2fr; gap: 4rem; } }
  .currently-grid .focus-text { font-size: 1.5rem; line-height: 1.4; }
  @media (min-width: 640px) { .currently-grid .focus-text { font-size: 1.875rem; } }

  /* Section heading */
  .section-heading { margin-bottom: 3rem; }
  .section-heading h2 { font-size: 1.875rem; margin-bottom: 1rem; }
  @media (min-width: 640px) { .section-heading h2 { font-size: 2.25rem; } }
  .section-heading p { color: var(--muted); font-size: 1rem; line-height: 1.6; }

  /* Project grid */
  .project-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
  @media (min-width: 640px) { .project-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 1024px) { .project-grid { grid-template-columns: repeat(3, 1fr); } }

  .project-card {
    display: flex; flex-direction: column; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface);
    overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm);
  }
  .project-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .project-card .project-cover { border-bottom: 1px solid var(--border); }
  .project-card .project-body { padding: 1.3rem 1.35rem 1.15rem; display: flex; flex-direction: column; flex: 1; }
  .pc-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.7rem;
    font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .pc-top .cat { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pc-top .yr { flex-shrink: 0; }
  .project-card h3.pc-title { font-size: 1.32rem; line-height: 1.15; margin-bottom: 1.4rem; }
  .pc-metric { border-left: 2px solid var(--accent); background: var(--accent-soft); padding: 0.7rem 0.9rem 0.75rem; border-radius: 0 6px 6px 0; margin-bottom: 1rem; }
  .pc-metric .k { display: block; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.3rem; }
  .pc-metric .v { display: block; font-family: var(--font-mono); font-size: 1.05rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; color: var(--accent); }
  .pc-did .k { display: block; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.35rem; }
  .pc-did p { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .project-card .pills { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.1rem; }
  .project-card .pill { font-size: 0.72rem; }
  .pc-foot { margin-top: auto; padding-top: 0.9rem; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .pc-foot .role { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .pc-foot .cta { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.82rem; font-weight: 600; color: var(--accent); }
  .pc-foot .cta svg { transition: transform 0.3s ease; }
  .project-card:hover .pc-foot .cta svg { transform: translate(3px, -3px); }
  .project-cover {
    aspect-ratio: 4/3; width: 100%; background: var(--accent-soft); display: flex; align-items: center;
    justify-content: center; position: relative; overflow: hidden;
  }
  .project-cover span { font-family: var(--font-display); font-size: 3.75rem; color: var(--accent); opacity: 0.25; }
  .project-body { padding: 1.5rem; }
  .project-body .cat { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--accent); margin-bottom: 0.5rem; }
  .project-body h3 { font-size: 1.25rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.375rem; }
  .project-body .desc { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .project-body .pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  /* Explore grid */
  .explore-grid {
    display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--border);
    border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  @media (min-width: 768px) { .explore-grid { grid-template-columns: repeat(3, 1fr); } }
  .explore-item {
    background: var(--surface); padding: 2rem; display: flex; align-items: center; justify-content: space-between;
    transition: background 0.2s; cursor: pointer;
  }
  .explore-item:hover { background: var(--accent-soft); }
  .explore-item h3 { font-size: 1.25rem; margin-bottom: 0.25rem; }
  .explore-item p { font-size: 0.875rem; color: var(--muted); }
  .explore-item .arrow { color: var(--muted); transition: all 0.3s; flex-shrink: 0; margin-left: 1rem; }
  .explore-item:hover .arrow { color: var(--accent); transform: translate(4px, -4px); }

  /* Page hero */
  .page-hero { padding-top: 4rem; padding-bottom: 3rem; }
  @media (min-width: 640px) { .page-hero { padding-top: 6rem; padding-bottom: 4rem; } }
  .page-hero h1 { font-size: 2.5rem; max-width: 48rem; line-height: 1.08; margin-bottom: 1.5rem; }
  @media (min-width: 640px) { .page-hero h1 { font-size: 3rem; } }
  @media (min-width: 768px) { .page-hero h1 { font-size: 3.75rem; } }
  .page-hero p { color: var(--muted); font-size: 1.125rem; max-width: 36rem; line-height: 1.6; }

  /* About */
  .about-grid { display: grid; grid-template-columns: 1fr; gap: 4rem; padding-bottom: 5rem; }
  @media (min-width: 1024px) { .about-grid { grid-template-columns: 1.4fr 1fr; } }
  .about-narrative > div { margin-bottom: 2.5rem; }
  .about-narrative p.body-text { font-size: 1.125rem; line-height: 1.7; }
  .about-narrative ul li { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.75rem; }
  .about-narrative ul li .num { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
  .about-narrative ul li .val { padding-bottom: 0.25rem; width: 100%; }
  .about-side { display: flex; flex-direction: column; gap: 2rem; }
  .about-side .card { padding: 1.5rem; }
  .about-side .card .eyebrow { margin-bottom: 1.25rem; }
  .fact-row { display: flex; flex-direction: column; gap: 0.125rem; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .fact-row:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .fact-row dt { font-size: 0.75rem; color: var(--muted); }
  .fact-row dd { font-size: 0.875rem; font-weight: 500; }
  .skill-group { margin-bottom: 1.25rem; }
  .skill-group:last-child { margin-bottom: 0; }
  .skill-group > p { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
  .skill-group .pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }

  /* Experience */
  .exp-list { display: flex; flex-direction: column; gap: 1.5rem; padding-bottom: 6rem; }
  .exp-group-head > div { display: flex; align-items: baseline; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; margin-bottom: 1.5rem; }
  .exp-group-head .eyebrow { margin-bottom: 0; }
  .exp-count { font-size: 0.75rem; color: var(--muted); }
  .exp-card {
    display: grid; grid-template-columns: 1fr; gap: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); padding: 2rem; transition: box-shadow 0.3s; box-shadow: var(--shadow-sm);
  }
  .exp-card:hover { box-shadow: var(--shadow-md); }
  @media (min-width: 768px) { .exp-card { grid-template-columns: 1fr 1.4fr; gap: 3rem; } }
  .exp-card .duration { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
  .exp-card h3 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .exp-card .org { color: var(--accent); font-size: 0.875rem; font-weight: 500; margin-bottom: 1.25rem; }
  .exp-card .pills { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .exp-card .desc { line-height: 1.6; margin-bottom: 1.25rem; }
  .exp-card .outcomes-label { font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.02em; color: var(--muted); margin-bottom: 0.75rem; }
  .exp-card .outcomes li { display: flex; gap: 0.75rem; font-size: 0.875rem; margin-bottom: 0.5rem; }
  .exp-card .outcomes li .dash { color: var(--accent); }

  /* Lead card styles retained for possible reuse */
  .lead-card {
    height: 100%; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface);
    padding: 2rem; display: flex; flex-direction: column; transition: all 0.3s;
  }
  .lead-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .lead-card .duration { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); margin-bottom: 0.5rem; }
  .lead-card h3 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  .lead-card .org { color: var(--accent); font-size: 0.875rem; font-weight: 500; margin-bottom: 1.5rem; }
  .lead-card dl > div { margin-bottom: 1rem; }
  .lead-card dl > div.learnings { padding-top: 0.75rem; border-top: 1px solid var(--border); }
  .lead-card dt { color: var(--muted); font-size: 0.75rem; margin-bottom: 0.25rem; }
  .lead-card dd { font-size: 0.875rem; }

  /* Timeline */
  .tl-wrap { padding-bottom: 6rem; }
  .tl-stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-bottom: 2rem; }
  .tl-stats > div { padding: 1.25rem 1rem 1.25rem 0; display: flex; flex-direction: column; gap: 0.2rem; }
  .tl-stats > div + div { border-left: 1px solid var(--border); padding-left: 1.25rem; }
  .tl-stats .v { font-family: var(--font-mono); font-weight: 500; font-size: clamp(1.8rem, 4.5vw, 2.6rem); line-height: 1; color: var(--accent); letter-spacing: -0.04em; }
  .tl-stats .l { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .tl-filters { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 3rem; }
  .tl-chip {
    display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.9rem; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-family: var(--font-body); font-size: 0.82rem; font-weight: 500;
    transition: all 0.2s ease;
  }
  .tl-chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .tl-chip b { font-family: var(--font-mono); font-weight: 500; font-size: 0.72rem; opacity: 0.7; }
  .tl-chip:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
  .tl-chip.active { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
  .tl-chip.active b { opacity: 0.85; }

  .tl-group { display: grid; grid-template-columns: 1fr; gap: 0.5rem; position: relative; }
  @media (min-width: 820px) { .tl-group { grid-template-columns: 11rem 1fr; gap: 2.5rem; } }
  .tl-year span {
    display: inline-block; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.04em; line-height: 0.9;
    font-size: clamp(2.6rem, 7vw, 4.75rem); color: transparent; -webkit-text-stroke: 1.5px color-mix(in srgb, var(--ink) 55%, transparent);
  }
  .tl-year span.is-next { -webkit-text-stroke: 1.5px var(--muted); }
  @media (min-width: 820px) { .tl-year { position: relative; } .tl-year span { position: sticky; top: 6rem; } }
  .tl-group:hover .tl-year span:not(.is-next) { color: var(--accent); -webkit-text-stroke-color: var(--accent); }
  .tl-year span { transition: color 0.4s ease, -webkit-text-stroke-color 0.4s ease; }

  .tl-items { position: relative; padding-left: 2rem; padding-bottom: 2.5rem; }
  .tl-items::before {
    content: ""; position: absolute; left: 0.45rem; top: 0.5rem; bottom: 0; width: 2px;
    background: linear-gradient(to bottom, color-mix(in srgb, var(--accent) 70%, transparent), color-mix(in srgb, var(--accent) 12%, transparent));
  }
  .tl-group:last-child .tl-items::before { bottom: 2.5rem; }
  .tl-card {
    position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.15rem 1.3rem 1.2rem; margin-bottom: 1rem; overflow: hidden; box-shadow: var(--shadow-sm);
    transition: transform 0.35s cubic-bezier(.16,.8,.28,1), border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .tl-card::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); opacity: 0.85; }
  .tl-card:hover { transform: translateX(3px); border-color: color-mix(in srgb, var(--c) 40%, var(--border)); box-shadow: var(--shadow-md); }
  .tl-node {
    position: absolute; left: calc(-2rem + 0.08rem); top: 1.35rem; width: 0.8rem; height: 0.8rem; border-radius: 50%;
    background: var(--bg); border: 2px solid var(--c); z-index: 2;
  }
  .tl-card { overflow: visible; }
  .tl-card::after { border-radius: var(--radius) 0 0 var(--radius); }
  .tl-card:hover .tl-node { background: var(--c); }
  .tl-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; margin-bottom: 0.55rem; }
  .tl-date { font-size: 0.75rem; color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); padding: 0.2rem 0.55rem; border-radius: 4px; }
  .tl-cat { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--c); }
  .tl-cat i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .tl-live { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: var(--accent-strong); padding: 0.18rem 0.5rem; border-radius: 999px; }
  .tl-card.is-now .tl-node { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation: tlPulse 2s infinite; }
  @keyframes tlPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 70% { box-shadow: 0 0 0 10px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .tl-card h3 { font-size: 1.2rem; margin-bottom: 0.35rem; }
  .tl-card p { font-size: 0.92rem; color: var(--muted); line-height: 1.6; }
  .tl-card.is-goal { background: transparent; border-style: dashed; box-shadow: none; }
  .tl-card.is-goal::after { display: none; }
  .tl-card.is-goal .tl-node { border-style: dashed; }
  .tl-hide { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .tl-card.is-now .tl-node { animation: none; } }

  /* Resume */
  .resume-grid { display: grid; grid-template-columns: 1fr; gap: 3rem; padding-bottom: 6rem; }
  @media (min-width: 1024px) { .resume-grid { grid-template-columns: 1.1fr 1fr; } }
  .resume-preview-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 2rem; box-shadow: var(--shadow-sm); }
  .resume-preview-box {
    aspect-ratio: 8.5/11; width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--accent-soft); display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;
    overflow: hidden;
  }
  .resume-preview-box embed, .resume-preview-box iframe { width: 100%; height: 100%; border: none; }
  .resume-side > div { margin-bottom: 2.5rem; }
  .edu-row { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); }
  .edu-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .edu-row .course { font-size: 0.875rem; font-weight: 500; }
  .edu-row .inst { font-size: 0.75rem; color: var(--muted); }
  .edu-row .right { text-align: right; flex-shrink: 0; }
  .edu-row .yr { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
  .edu-row .score { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }

  .resume-bottom-grid { display: grid; grid-template-columns: 1fr; gap: 3rem; padding-bottom: 6rem; border-top: 1px solid var(--border); padding-top: 4rem; }
  @media (min-width: 768px) { .resume-bottom-grid { grid-template-columns: repeat(2, 1fr); } }
  .achieve-item, .extra-item { padding-bottom: 1.25rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
  .achieve-item:last-child, .extra-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .achieve-item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; margin-bottom: 0.25rem; }
  .achieve-item .title, .extra-item .title { font-size: 0.875rem; font-weight: 500; }
  .achieve-item .yr { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); flex-shrink: 0; }
  .achieve-item .d, .extra-item .d { font-size: 0.75rem; color: var(--muted); }
  .extra-item .title { margin-bottom: 0.25rem; }

  /* Contact */
  .contact-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); overflow: hidden; }
  .contact-card > a { border-bottom: 1px solid var(--border); }
  .contact-card > a:last-child { border-bottom: none; }
  .channel { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem; transition: background 0.2s; }
  .channel:hover { background: var(--accent-soft); }
  .channel-left { display: flex; align-items: center; gap: 1rem; }
  .channel-icon { display: flex; align-items: center; justify-content: center; height: 2.5rem; width: 2.5rem; border-radius: 999px; background: var(--accent-soft); color: var(--accent); flex-shrink: 0; }
  .channel-label { font-size: 0.75rem; color: var(--muted); }
  .channel-value { font-size: 0.875rem; font-weight: 500; }
  .channel .arrow { color: var(--muted); transition: all 0.3s; flex-shrink: 0; }
  .channel:hover .arrow { color: var(--accent); transform: translate(4px, -4px); }

  /* Project card cover: slide 1 as a still image */
  .project-cover-img { background: var(--surface); aspect-ratio: 16/9; }
  .project-cover-img img { width: 100%; height: 100%; object-fit: cover; object-position: top center; transition: transform 0.6s cubic-bezier(.16,.8,.28,1); }
  .project-card:hover .project-cover-img img { transform: scale(1.04); }
  .project-cover-img .cover-badge {
    position: absolute; left: 0.75rem; top: 0.75rem; z-index: 2; font-family: var(--font-mono); font-size: 0.65rem;
    letter-spacing: 0.12em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px); padding: 0.3rem 0.6rem; border-radius: 999px; opacity: 1;
  }

  /* ---------- Project detail (case-study layout) ---------- */
  #readProgress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 60; transition: width 0.1s linear; }
  .pd-hero { padding-top: 3rem; padding-bottom: 2.5rem; }
  .pd-back { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--muted); margin-bottom: 2rem; cursor: pointer; background: none; border: none; font-family: var(--font-body); }
  .pd-back:hover { color: var(--accent); }
  .pd-index { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 0.14em; margin-bottom: 0.75rem; }
  .pd-index b { color: var(--accent); font-weight: 500; }
  .pd-hero h1 { font-size: clamp(2.6rem, 6.5vw, 4.8rem); line-height: 0.95; margin-bottom: 1.25rem; color: var(--ink); }
  .pd-hero h1 .accent { color: var(--accent-display); }
  .pd-lede { font-size: clamp(1.05rem, 1.8vw, 1.3rem); line-height: 1.55; color: var(--muted); max-width: 46rem; }
  .pd-facts { display: grid; grid-template-columns: 1fr; margin-top: 2.25rem; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  @media (min-width: 600px) { .pd-facts { grid-template-columns: repeat(3, auto); justify-content: start; } }
  .pd-fact.is-hl dd { color: var(--accent); font-family: var(--font-mono); font-weight: 500; letter-spacing: -0.01em; }
  .pd-fact { padding: 1.1rem 1rem 1.1rem 0; }
  .pd-fact + .pd-fact { padding-left: 1rem; border-left: 1px solid var(--border); }
  .pd-fact { padding-right: 2rem; }
  @media (max-width: 599px) { .pd-fact + .pd-fact { border-left: none; padding-left: 0; border-top: 1px solid var(--border); } }
  .pd-fact dt { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.35rem; }
  .pd-fact dd { font-weight: 600; font-size: 0.95rem; }

  .pd-hero { padding-bottom: 4rem !important; }
  .pd-hero-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; align-items: center; }
  .pd-cover-side { display: none; }
  @media (min-width: 900px) {
    .pd-hero-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 3.5rem; }
    .pd-cover-side { display: block; }
    .pd-cover-side .pd-cover-frame { transform: rotate(2deg); transition: transform 0.5s cubic-bezier(.16,.8,.28,1); }
    .pd-cover-side .pd-cover-frame:hover { transform: rotate(0deg) translateY(-4px); }
  }
  .pd-cover-side .open-chip { font-size: 0.72rem; padding: 0.45rem 0.8rem; right: 0.7rem; bottom: 0.7rem; }
  .pd-cover-frame {
    position: relative; display: block; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
    background: var(--surface); box-shadow: var(--shadow-md);
  }
  .pd-cover-frame img { width: 100%; aspect-ratio: 16/9; object-fit: cover; object-position: top center; transition: transform 0.8s cubic-bezier(.16,.8,.28,1); }
  .pd-cover-frame:hover img { transform: scale(1.025); }
  .pd-cover-frame .open-chip {
    position: absolute; right: 1rem; bottom: 1rem; display: inline-flex; align-items: center; gap: 0.4rem;
    background: var(--accent-strong); color: #fff; font-size: 0.8rem; font-weight: 600; padding: 0.55rem 0.95rem; border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); transition: transform 0.3s ease;
  }
  .pd-cover-frame:hover .open-chip { transform: translateY(-3px); }
  .pd-cover-fallback { aspect-ratio: 16/7; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); }
  .pd-cover-fallback span { font-family: var(--font-display); font-size: 5rem; color: var(--accent); opacity: 0.3; }

  .pd-wrap { max-width: 60rem; margin: 0 auto; padding: 0 1.5rem; }
  .pd-section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 2rem; }
  .pd-section-title h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }

  /* the story: chapters on a rail */
  .pd-story { position: relative; padding-bottom: 4.5rem; }
  .pd-chapter { position: relative; display: grid; grid-template-columns: 3.25rem 1fr; gap: 1.25rem; padding-bottom: 2.75rem; }
  @media (min-width: 768px) { .pd-chapter { grid-template-columns: 5.5rem 1fr; gap: 2rem; } }
  .pd-chapter::before { content: ""; position: absolute; left: 1.6rem; top: 3.4rem; bottom: 0.4rem; width: 1px; background: var(--border); }
  @media (min-width: 768px) { .pd-chapter::before { left: 2.7rem; top: 4.6rem; } }
  .pd-chapter:last-child::before { display: none; }
  .pd-num {
    font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; color: transparent;
    -webkit-text-stroke: 1.5px var(--accent); text-align: center; transition: color 0.4s ease;
  }
  @media (min-width: 768px) { .pd-num { font-size: 4rem; } }
  .pd-chapter:hover .pd-num { color: var(--accent); }
  .pd-chapter h3 { font-size: 1.35rem; margin-bottom: 0.35rem; }
  .pd-chapter .kicker { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.4rem; }
  .pd-chapter p.body { font-size: 1.08rem; line-height: 1.75; }
  .pd-chapter.is-problem .body {
    font-size: clamp(1.15rem, 2.2vw, 1.45rem); line-height: 1.5; font-weight: 500;
    border-left: 3px solid var(--accent); padding: 0.25rem 0 0.25rem 1.1rem;
  }
  .pd-chapter.is-solution .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.4rem; }

  /* results */
  .pd-results { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 4.5rem; }
  @media (min-width: 700px) { .pd-results { grid-template-columns: repeat(2, 1fr); } }
  .pd-result {
    position: relative; overflow: hidden; border-radius: var(--radius); padding: 1.5rem 1.4rem 1.4rem;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); transition: transform 0.3s ease, border-color 0.3s ease;
  }
  .pd-result:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .pd-result .big { font-family: var(--font-display); font-size: 2.6rem; line-height: 1; color: var(--accent); margin-bottom: 0.6rem; }
  .pd-result .ghost { position: absolute; right: -0.4rem; bottom: -1.6rem; font-family: var(--font-display); font-size: 6rem; color: var(--accent); opacity: 0.07; pointer-events: none; }
  .pd-result p { font-size: 1rem; line-height: 1.55; font-weight: 500; position: relative; }

  /* toolkit */
  .pd-toolkit { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-bottom: 4.5rem; }
  .pd-toolkit .pill { font-size: 0.85rem; padding: 0.45rem 0.95rem; border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }

  /* document */
  .pd-deck { max-width: 60rem; margin: 0 auto; padding: 0 1.5rem 5rem; }
  .pd-deck-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.25rem; }
  .pd-deck-head h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); }
  .pd-deck-frame {
    aspect-ratio: 16/10; width: 100%; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm);
  }
  .pd-deck-frame iframe { width: 100%; height: 100%; border: none; display: block; }
  .pd-deck-mobile { display: none; }
  @media (max-width: 767px) {
    .pd-deck-frame, .pd-desk-only { display: none !important; }
    .pd-deck-mobile {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.25rem 1.3rem;
      border-radius: var(--radius); background: var(--accent-strong); color: #fff; box-shadow: var(--shadow-sm);
    }
    .pd-deck-mobile .k { display: block; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.8; margin-bottom: 0.2rem; }
    .pd-deck-mobile .t { display: block; font-family: var(--font-display); font-weight: 750; font-size: 1.2rem; letter-spacing: -0.02em; }
    .pd-deck-mobile .go { display: flex; align-items: center; justify-content: center; width: 2.75rem; height: 2.75rem; border-radius: 50%; background: rgba(255,255,255,0.18); flex-shrink: 0; }
  }
  .pd-doc-card { border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); padding: 1.25rem; margin-bottom: 5rem; }
  .pd-doc-preview { aspect-ratio: 16/10; width: 100%; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--accent-soft); overflow: hidden; margin-bottom: 1.1rem; }
  .pd-doc-preview iframe { width: 100%; height: 100%; border: none; }
  .pd-doc-actions { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; justify-content: space-between; }
  .pd-doc-actions .hint { font-size: 0.8rem; color: var(--muted); }
  .pd-doc-mt { display: none; }
  @media (max-width: 767px) { .pd-doc-dt { display: none; } .pd-doc-mt { display: inline; } }

  /* prev / next */
  .pd-pager { max-width: 72rem; margin: 0 auto; padding: 0 1.5rem 6rem; display: grid; grid-template-columns: 1fr; gap: 1px; }
  @media (min-width: 700px) { .pd-pager { grid-template-columns: 1fr 1fr; } }
  .pd-pager a {
    display: flex; flex-direction: column; gap: 0.4rem; padding: 2rem 1.5rem; background: var(--surface);
    border: 1px solid var(--border); cursor: pointer; transition: background 0.3s ease;
  }
  .pd-pager a:hover { background: var(--accent-soft); }
  .pd-pager a.next { text-align: right; align-items: flex-end; }
  .pd-pager .dir { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .pd-pager .ttl { font-family: var(--font-display); font-weight: 750; letter-spacing: -0.02em; font-size: 1.5rem; color: var(--ink); }
  .pd-pager a:hover .ttl { color: var(--accent); }
  .pd-pager-all { text-align: center; padding-bottom: 6rem; margin-top: -3.5rem; }
  .pd-pager-all a { font-size: 0.875rem; color: var(--accent); cursor: pointer; }

  footer { border-top: 1px solid var(--border); margin-top: 6rem; }
  .footer-inner {
    max-width: 72rem; margin: 0 auto; padding: 2.5rem 1.5rem; display: flex; flex-direction: column;
    align-items: center; justify-content: space-between; gap: 1rem; font-size: 0.875rem; color: var(--muted);
  }
  @media (min-width: 640px) { .footer-inner { flex-direction: row; } }
  .coffee { transition: transform 0.5s; display: inline-block; }
  .footer-inner button:hover .coffee { transform: rotate(-8deg); }
  .footer-inner button { background: none; border: none; color: var(--muted); font-family: var(--font-body); font-size: 0.875rem; cursor: default; }

  /* Marquee / horizontal scroller */
  .marquee {
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    background: var(--accent-soft); overflow: hidden; white-space: nowrap; padding: 0.9rem 0;
  }
  .marquee-track {
    display: inline-flex; gap: 2.5rem; animation: marqueeScroll 22s linear infinite;
    width: max-content;
  }
  .marquee:hover .marquee-track { animation-play-state: paused; }
  .marquee-item {
    font-family: var(--font-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--accent); display: inline-flex; align-items: center; gap: 0.75rem;
  }
  .marquee-item .dot-sep { color: var(--muted); opacity: 0.6; }
  @keyframes marqueeScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .marquee-track { animation: none; }
  }
  svg.icon { width: 15px; height: 15px; flex-shrink: 0; }

<script>
(function(){
  var root = document.documentElement, skip = false;
  try { skip = sessionStorage.getItem("tg-intro") === "1" || window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) {}
  var el = document.getElementById("intro");
  if (skip) { el.parentNode.removeChild(el); return; }
  root.classList.add("intro-on");
  var words = ["Hello", "नमस्ते", "નમસ્તે", "Hola", "Bonjour", "வணக்கம்", "Ciao", "こんにちは", "Olá", "안녕하세요", "Hallo", "Привет"];
  var w = document.getElementById("introWord"), i = 0, done = false, timer;
  requestAnimationFrame(function(){ document.getElementById("introBar").style.width = "100%"; });
  function swap(text){
    var n = document.createElement("span"); n.textContent = text;
    w.parentNode.replaceChild(n, w); w = n;
  }
  function finish(){
    if (done) return; done = true; clearInterval(timer);
    try { sessionStorage.setItem("tg-intro", "1"); } catch(e) {}
    el.classList.add("out");
    setTimeout(function(){ el.classList.add("lift"); }, 150);
    setTimeout(function(){ root.classList.remove("intro-on"); el.classList.add("gone"); }, 600);
    setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1100);
  }
  timer = setInterval(function(){
    i++;
    if (i < words.length) { swap(words[i]); return; }
    clearInterval(timer);
    setTimeout(finish, 120);
  }, 115);
  el.addEventListener("click", finish);
})();
</script>

}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function highlightText(text, terms){
  let out = esc(text);
  (terms||[]).forEach(term=>{
    const escTerm = esc(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    out = out.replace(new RegExp(`(${escTerm})`,"i"), `<span class="hl">$1</span>`);
  });
  return out;
}

function applyThemeIcon(){
  const isDark = document.documentElement.classList.contains("dark");
  document.getElementById("themeToggleDesktop").innerHTML = isDark ? ICONS.sun : ICONS.moon;
  document.getElementById("mThemeIcon").innerHTML = isDark ? ICONS.sun : ICONS.moon;
}
function toggleTheme(){
  document.documentElement.classList.toggle("dark");
  try{ localStorage.setItem("tg-theme", document.documentElement.classList.contains("dark") ? "dark" : "light"); }catch(e){}
  applyThemeIcon();
}
(function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem("tg-theme"); }catch(e){}
  if (saved !== "light") {
    document.documentElement.classList.add("dark");
  }
})();

function projectCard(project, index){

function renderTimeline(){
  const groups = [];
  timeline.forEach(e=>{ let g = groups.find(x=>x.key===e.group); if(!g){ g={key:e.group, items:[]}; groups.push(g); } g.items.push(e); });
  const cats = ["Experience","Project","Achievement","Education","Leadership"].filter(c=>timeline.some(e=>e.category===c));
  const ventures = timeline.filter(e=>e.category==="Experience"||e.category==="Project").length;
  const years = groups.filter(g=>/^\d{4}$/.test(g.key)).map(g=>+g.key);
  const span = years.length ? (Math.max(...years) - Math.min(...years) + 1) : 0;
  let n = 0;
  return `
  ${pageHero("Timeline", "The journey, entry by entry", "Every line below is a real, dated entry — education, ventures, leadership, and the odd hackathon podium — newest first.")}
  <section class="max-w-6xl tl-wrap">
    ${fade(`<div class="tl-stats">
      <div><span class="v">${timeline.length - 1}</span><span class="l">Milestones</span></div>
      <div><span class="v">${ventures}</span><span class="l">Roles &amp; ventures</span></div>
      <div><span class="v">${span}</span><span class="l">Years on the clock</span></div>
    </div>`)}
    ${fade(`<div class="tl-filters" role="tablist">
      <button class="tl-chip active" data-cat="all" onclick="filterTimeline('all',this)">All <b>${timeline.length}</b></button>
      ${cats.map(c=>`<button class="tl-chip" data-cat="${c}" onclick="filterTimeline('${c}',this)"><i style="background:${categoryColor[c]}"></i>${c} <b>${timeline.filter(e=>e.category===c).length}</b></button>`).join("")}
    </div>`, 0.05)}
    <div class="tl-groups">
      ${groups.map(g=>`<div class="tl-group" data-group="${esc(g.key)}">
        <div class="tl-year"><span class="${g.key==="Next"?"is-next":""}">${esc(g.key)}</span></div>
        <div class="tl-items">
          ${g.items.map(e=>{ const i = n++; const goal = e.category==="Goal"; const now = i===1;
            return fade(`<article class="tl-card${goal?" is-goal":""}${now?" is-now":""}" data-cat="${e.category}" style="--c:${categoryColor[e.category]}">
              <span class="tl-node"></span>
              <div class="tl-meta">
                <span class="tl-date font-mono-num">${esc(e.year)}</span>
                <span class="tl-cat"><i></i>${esc(goal ? "Up next" : e.category)}</span>
                ${now ? `<span class="tl-live">Latest</span>` : ""}
              </div>
              <h3 class="font-display">${esc(e.title)}</h3>
              <p>${esc(e.detail)}</p>
            </article>`, Math.min(i*0.04,0.3)); }).join("")}
        </div>
      </div>`).join("")}
    </div>
  </section>`;
}

  document.querySelectorAll(".tl-chip").forEach(b=>b.classList.toggle("active", b===btn));
  document.querySelectorAll(".tl-card").forEach(c=>{ c.classList.toggle("tl-hide", cat!=="all" && c.dataset.cat!==cat); });

    <p class="pd-index">CASE <b>${String(idx+1).padStart(2,"0")}</b> / ${String(projects.length).padStart(2,"0")}</p>
    <h1 class="font-display">${splitTitle(project.title)}</h1>

  <div class="pd-wrap">

    <div class="pd-story">
      ${chapters.map((c,i)=>fade(`<div class="pd-chapter is-${c.key}">

        <div>
          <p class="kicker">${c.kicker}</p>
          <h3 class="font-display">${c.title}</h3>
          ${c.key === "solution" ? `<div class="card"><p class="body">${esc(c.text)}</p></div>` : `<p class="body">${esc(c.text)}</p>`}
        </div>
      </div>`, i*0.05)).join("")}
    </div>

    <div class="pd-section-title">${fade(`<h2 class="font-display">Key results</h2>`)}</div>
    <div class="pd-results">
      ${project.results.map((r,i)=>fade(`<div class="pd-result">
        <div class="big">✓</div>
        <p>${esc(r)}</p>
        <span class="ghost">${String(i+1).padStart(2,"0")}</span>
      </div>`, i*0.06)).join("")}
    </div>

    ${project.reflection ? fade(`<div class="pd-chapter is-problem" style="grid-template-columns:1fr;"><div><p class="kicker">Reflection</p><p class="body">${esc(project.reflection)}</p></div></div>`) : ""}

    ${project.skills && project.skills.length ? `
    <div class="pd-section-title">${fade(`<h2 class="font-display">Toolkit</h2>`)}</div>
    ${fade(`<div class="pd-toolkit">${project.skills.map(pill).join("")}</div>`)}` : ""}

  ${src ? `<section class="pd-deck">

window.addEventListener("scroll", ()=>{
  const bar = document.getElementById("readProgress");

  bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";

/* ---------------- ROUTER ---------------- */
const renderers = {
  home: renderHome, about: renderAbout, experience: renderExperience,
  projects: renderProjects, timeline: renderTimeline,
  contact: renderContact
};

let revealObserver = null;
function initReveal(){
  if (revealObserver) revealObserver.disconnect();
  revealObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if (entry.isIntersecting){
        entry.target.classList.add("visible");
        revealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: "0px 0px -40px 0px" });
  document.querySelectorAll("#app .fade-in").forEach(el=>revealObserver.observe(el));
}

function initCountUp(){
  const els = document.querySelectorAll(".count-up");
  if (!els.length) return;
  const countObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if (!entry.isIntersecting) return;
      const el = entry.target;
      countObserver.unobserve(el);
      const target = el.dataset.target || "";
      const m = target.match(/^([^\d]*)([\d.]+)(.*)$/);
      if (!m){ el.textContent = target; return; }
      const [, prefix, numStr, suffix] = m;
      const decimals = (numStr.split(".")[1] || "").length;
      const end = parseFloat(numStr);
      const duration = 900;
      const start = performance.now();
      function tick(now){
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = (end * eased).toFixed(decimals);
        el.textContent = prefix + val + suffix;
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      }
      requestAnimationFrame(tick);
    });
  }, { threshold: 0.4 });
  els.forEach(el=>countObserver.observe(el));
}

function initCardGlow(){
  document.querySelectorAll(".project-card, .lead-card").forEach(card=>{
    card.addEventListener("mousemove", (e)=>{
      const rect = card.getBoundingClientRect();
      card.style.setProperty("--mx", (e.clientX - rect.left) + "px");
      card.style.setProperty("--my", (e.clientY - rect.top) + "px");
    });
  });
}

function fitHeroName(){
  const el = document.querySelector(".hero-name");
  if (!el) return;
  const box = el.parentElement.clientWidth;
  el.style.fontSize = "";
  el.style.width = "max-content";
  const base = parseFloat(getComputedStyle(el).fontSize);
  const w = el.getBoundingClientRect().width;
  el.style.width = "";
  if (!w || !box) return;
  const max = 17 * parseFloat(getComputedStyle(document.documentElement).fontSize);
  el.style.fontSize = Math.min(base * box / w * 0.98, max) + "px";
  const tn = el.firstChild, sp = tn && tn.nodeType === 3 ? tn.textContent.indexOf(" ") : -1;
  if (sp > 0) {
    const r = document.createRange(); r.setStart(tn, sp); r.setEnd(tn, sp + 1);
    const g = r.getBoundingClientRect(), p = el.parentElement.getBoundingClientRect();
    el.parentElement.style.setProperty("--photo-x", (g.left + g.width / 2 - p.left - p.width * 0.015) + "px");
  }
}
window.addEventListener("resize", fitHeroName);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeroName);

function afterRender(){
  fitHeroName();
  initReveal();
  initCountUp();
  initCardGlow();
}

function go(key){
  const app = document.getElementById("app");
  const render = ()=>{
    app.innerHTML = renderers[key] ? renderers[key]() : renderHome();
    updateActiveNav(key);
    window.scrollTo({ top: 0, behavior: "auto" });
    history.replaceState(null, "", "#" + key);
    requestAnimationFrame(()=>{ app.classList.remove("page-leaving"); afterRender(); });
  };
  if (app.innerHTML.trim()){
    app.classList.add("page-leaving");
    setTimeout(render, 180);
  } else {
    render();
  }
}

function goProject(slug){
  const app = document.getElementById("app");
  const render = ()=>{
    app.innerHTML = renderProjectDetail(slug);
    updateActiveNav("projects");
    window.scrollTo({ top: 0 });
    history.replaceState(null, "", "#projects/" + slug);
    requestAnimationFrame(()=>{ app.classList.remove("page-leaving"); afterRender(); });
  };
  app.classList.add("page-leaving");
  setTimeout(render, 180);
}

/* ---------------- INIT ---------------- */
renderNav();
applyThemeIcon();

(function initRoute(){
  const hash = window.location.hash.replace("#","");
  if (hash.startsWith("projects/")) {
    goProject(hash.split("/")[1]);
  } else if (renderers[hash]) {
    go(hash);
  } else {
    go("home");
  }
})();
</script>
